version: '3'

services:
  # FastAPI应用
  api:
    build: .
    container_name: memory-chat-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=44beb488-3916-4da6-912c-5ebcf50644c5
      - OPENAI_BASE_URL=https://ark.cn-beijing.volces.com/api/v3
      - DEFAULT_MODEL=doubao-seed-1-6-flash-250828
      - MEMORY_MODE_ENABLED=true
    volumes:
      - ./static:/app/static
    depends_on:
      - qdrant
      - ollama
    networks:
      - memory-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Qdrant向量数据库
  qdrant:
    image: docker.1ms.run/qdrant/qdrant:latest
    container_name: memory-chat-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"  # 用于监控API
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - memory-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama服务
  ollama:
    image: docker.1ms.run/ollama/ollama:latest
    container_name: memory-chat-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-init.sh:/ollama-init.sh
    networks:
      - memory-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G  # 为Ollama分配足够的内存
          cpus: '4'  # 限制CPU使用
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Ollama需要更长时间启动
    # 启动时预加载必需的模型
    command: ["/bin/sh", "-c", "/ollama-init.sh && ollama serve"]

networks:
  memory-net:
    driver: bridge

volumes:
  qdrant_data:
  ollama_data:
