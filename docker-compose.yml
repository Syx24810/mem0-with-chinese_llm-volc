version: '3'

services:
  # FastAPI应用
  api:
    build: .
    container_name: memory-chat-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=sk-e9cf68e1a66b4846ba1111523ef294a5
      - OPENAI_BASE_URL=https://api.deepseek.com/v1
      - DEFAULT_MODEL=deepseek-chat
      - MEMORY_MODE_ENABLED=true
      - EMBEDDING_API_KEY=sk-mdrdlcaynuvvddqqwatoidvwlemcrebqbjbnsfoaatvwwwfl
    volumes:
      - ./static:/app/static
    depends_on:
      - qdrant

    networks:
      - memory-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Qdrant向量数据库
  qdrant:
    image: docker.1ms.run/qdrant/qdrant:latest
    container_name: memory-chat-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"  # 用于监控API
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - memory-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama服务



networks:
  memory-net:
    driver: bridge

volumes:
  qdrant_data:
  ollama_data:
